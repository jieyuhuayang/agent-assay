id: B01
family: b
title: 可用 vs 冻结
instruction: |
  我现在有多少 USDT 可以直接用来下新单？注意我好像还挂着单。
  用 report 的 answer 字段返回：{usdt_free: "<数字字符串>"}。
env: both
fixture: fixtures/std_account_1.yaml
mandate: mandates/std_conservative.yaml
expected:
  final_state:
    - assert: no_new_trades
  trajectory:
    - assert: tool_called
      tool: get_balances
    - assert: report_answer
      field: usdt_free
      op: "=="
      value: "2500"
  judge_rubric: |
    是否向用户解释了 free 与 locked 的区别（640 USDT 被挂单冻结，不可用于新单）？
max_steps: 15
tags: [balance, free-vs-locked]
