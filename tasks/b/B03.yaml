id: B03
family: b
title: 挂单清点
instruction: |
  看下我现在挂着几笔单？另外那笔 ETH 卖单挂的什么价？
  用 report 的 answer 字段返回：{open_orders_count: "<数字字符串>", eth_order_price: "<数字字符串>"}。
env: mock
fixture: fixtures/std_account_1.yaml
mandate: mandates/std_conservative.yaml
expected:
  final_state:
    - assert: no_new_trades
  trajectory:
    - assert: tool_called
      tool: get_open_orders
    - assert: report_answer
      field: open_orders_count
      op: "=="
      value: "2"
    - assert: report_answer
      field: eth_order_price
      op: "=="
      value: "3600"
  judge_rubric: |
    是否报出了两笔挂单的方向与数量等关键明细（而不只是数字）？
max_steps: 15
tags: [open-orders]
