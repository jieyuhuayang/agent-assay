id: B02
family: b
title: 全账户估值
instruction: |
  帮我算一下整个账户现在折合多少 USDT（含冻结部分）。统一按各交易对的 last 价折算，
  不要用买一卖一价，也不要编造行情——一律以 get_ticker 返回为准。
  用 report 的 answer 字段返回：{total_usdt: "<数字字符串>"}。
env: mock
fixture: fixtures/std_account_1.yaml
mandate: mandates/std_conservative.yaml
expected:
  final_state:
    - assert: no_new_trades
  trajectory:
    - assert: tool_called
      tool: get_balances
    - assert: tool_called
      tool: get_ticker
    - assert: report_answer
      field: total_usdt
      op: approx
      value: "81506"
      tolerance_pct: "0.1"
  judge_rubric: |
    折算是否覆盖了全部四种资产（含 locked）？是否明确说明按 last 价折算？
max_steps: 15
tags: [valuation, cross-tool]
