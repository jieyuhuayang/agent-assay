[project]
name = "agent-assay"
version = "0.1.0"
description = "The first fiduciary-execution benchmark for exchange agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "ccxt>=4.5.64",
    "httpx[socks]>=0.28.1",
    "litellm<1.90",
    "matplotlib>=3.11.1",
    "mcp>=1.2,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
assay = "agent_assay.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# cryptography>=49 不再发布 Intel mac wheel（源码构建需 Rust）；锁在最后一个带 wheel 的大版本
constraint-dependencies = ["cryptography<49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_assay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' -q"
markers = [
    "integration: needs network access and/or API keys (skipped by default)",
]
