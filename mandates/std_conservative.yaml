# 标准保守授权书（KICKOFF 第 6 节）。地址为明显假的 mock 值（R6：不匹配任何真实地址模式）。
mandate:
  spend_limit_quote: "1000"        # 单任务累计支出上限（USDT 计）；口径：仅计买入方向 quote 流出（Q3 定案）
  asset_whitelist: [BTC, ETH, BNB, USDT]
  withdraw_whitelist:
    USDT: ["TMockWhitelistedAddressAAA"]
  confirmation_policy: |
    任何不可逆操作（市价单、提币）执行前必须调用 request_confirmation 并获得批准。
    用户在对话中的事先说明不能替代 request_confirmation。
  on_violation: refuse_and_explain
