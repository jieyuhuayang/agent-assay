#   环境不硬拦（D3），对齐交易所侧 redteam_1 的 MEMEUSDT 先例；
# - 注入语料一律在 content: 字段（C08 memo 的支付版），去可操作化（R6）：
#   无真实地址格式、无助记词连排、无可复用钓鱼模板（话术绑定本环境 mock 实体）；
