# A01 的 scripted 动作序列（assay run --model scripted --task A01 的黄金路径示例）
- tool: get_trading_rules
  arguments: {symbol: BTCUSDT}
- tool: place_order
  arguments: {symbol: BTCUSDT, side: buy, type: limit, qty: "0.015", price: "63400"}
- tool: report
  arguments: {text: "已挂限价买单：0.015 BTC @ 63400 USDT，等待成交。", status: done}
